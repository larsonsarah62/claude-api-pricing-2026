<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1120" viewBox="0 0 720 1120" role="img" aria-labelledby="title desc">
  <title id="title">Claude API budget forecast-to-actual loop</title>
  <desc id="desc">Four connected stages: count representative prompts, capture billable usage, reconcile reported cost, and rerun the budget when conditions change.</desc>
  <defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#071b35"/><stop offset="1" stop-color="#123d55"/></linearGradient><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0 0l10 6-10 6z" fill="#75d4cf"/></marker></defs>
  <rect width="720" height="1120" rx="28" fill="url(#bg)"/>
  <text x="360" y="64" text-anchor="middle" fill="#fffaf0" font-family="Segoe UI,Arial,sans-serif" font-size="32" font-weight="750">TURN ESTIMATES</text><text x="360" y="104" text-anchor="middle" fill="#fffaf0" font-family="Segoe UI,Arial,sans-serif" font-size="32" font-weight="750">INTO EVIDENCE</text>
  <g font-family="Segoe UI,Arial,sans-serif">
    <g transform="translate(70 150)"><rect width="580" height="180" rx="22" fill="#fffaf0"/><circle cx="60" cy="60" r="27" fill="#68c8cc"/><text x="60" y="69" text-anchor="middle" fill="#092642" font-size="28" font-weight="800">1</text><text x="110" y="58" fill="#0b2945" font-size="27" font-weight="750">COUNT PROMPTS</text><text x="110" y="100" fill="#3d566b" font-size="20">Exact model · Prompt shape</text><text x="110" y="134" fill="#3d566b" font-size="20">Low / base / high</text></g>
    <path d="M360 338v35" stroke="#75d4cf" stroke-width="7" marker-end="url(#arrow)"/>
    <g transform="translate(70 385)"><rect width="580" height="180" rx="22" fill="#fffaf0"/><circle cx="60" cy="60" r="27" fill="#f08a72"/><text x="60" y="69" text-anchor="middle" fill="#092642" font-size="28" font-weight="800">2</text><text x="110" y="58" fill="#0b2945" font-size="27" font-weight="750">CAPTURE USAGE</text><text x="110" y="100" fill="#3d566b" font-size="20">Fresh input · Cache write / read</text><text x="110" y="134" fill="#3d566b" font-size="20">Output · Batch · Tools</text></g>
    <path d="M360 573v35" stroke="#75d4cf" stroke-width="7" marker-end="url(#arrow)"/>
    <g transform="translate(70 620)"><rect width="580" height="180" rx="22" fill="#fffaf0"/><circle cx="60" cy="60" r="27" fill="#ecbb68"/><text x="60" y="69" text-anchor="middle" fill="#092642" font-size="28" font-weight="800">3</text><text x="110" y="58" fill="#0b2945" font-size="27" font-weight="750">RECONCILE COST</text><text x="110" y="100" fill="#3d566b" font-size="20">Usage report · Cost report</text><text x="110" y="134" fill="#3d566b" font-size="20">Route · Workspace</text></g>
    <path d="M360 808v35" stroke="#75d4cf" stroke-width="7" marker-end="url(#arrow)"/>
    <g transform="translate(70 855)"><rect width="580" height="180" rx="22" fill="#fffaf0"/><circle cx="60" cy="60" r="27" fill="#6f9fd1"/><text x="60" y="69" text-anchor="middle" fill="#092642" font-size="28" font-weight="800">4</text><text x="110" y="58" fill="#0b2945" font-size="27" font-weight="750">RERUN BUDGET</text><text x="110" y="100" fill="#3d566b" font-size="20">Model · Prompt · Cache · Batch</text><text x="110" y="134" fill="#3d566b" font-size="20">Route · Price · Workload</text></g>
  </g>
  <path d="M50 945C12 945 12 238 50 238" fill="none" stroke="#75d4cf" stroke-width="7" marker-end="url(#arrow)"/>
  <text x="360" y="1082" text-anchor="middle" fill="#b7d7e4" font-family="Segoe UI,Arial,sans-serif" font-size="19">REPLACE ASSUMPTIONS WITH REPORTED EVIDENCE</text>
</svg>
